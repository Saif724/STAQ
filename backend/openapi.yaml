openapi: 3.0.3

info:
  title: STAQ API
  description: |
    REST API for STAQ (Smart Task Automation Queue).

    STAQ allows users to create tasks, configure triggers and actions,
    schedule executions, connect Gmail accounts, and monitor execution logs.

    Routes are registered at the root path (there is no /api/v1 prefix).
    Queue routes require bearer authentication. Successful JSON responses
    use a data wrapper and errors use an error object; see the schemas below.
    Creating a task requires an explicit active queue_id; no default queue is
    selected. Execution collection/list and connection list/disconnect routes
    are not currently exposed.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  # Replace with the deployed backend URL when available.
  # - url: https://api.example.com
  #   description: Production server

tags:
  - name: Health
    description: Service health
  - name: Authentication
    description: User registration, login, verification, and token management
  - name: Users
    description: Authenticated user information
  - name: Gmail
    description: Gmail account connection
  - name: Tasks
    description: Task management
  - name: Queues
    description: Queue management
  - name: Triggers
    description: Task trigger management
  - name: Actions
    description: Task action management
  - name: Executions
    description: Execution and execution log information

paths:

  /health:
    get:
      tags:
        - Health
      summary: Check service health
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: All required services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                database: ok
                redis: ok

        '503':
          description: One or more required services are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: error
                database: ok
                redis: error


  # ============================================================
  # AUTHENTICATION
  # ============================================================

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              full_name: Saif Ahmed
              email: saif@example.com
              password: StrongPassword123!

      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseWrapper'

        '400':
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: saif@example.com
              password: StrongPassword123!

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseWrapper'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Account is inactive or email is not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      operationId: refreshAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbGciOi...

      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponseWrapper'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refresh_token: eyJhbGciOi...

      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: string
              example:
                data: logged out successfully

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              email: saif@example.com
              code: "483921"

      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseWrapper'
              example:
                data:
                  message: email verified successfully

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Email is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification code
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: saif@example.com

      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseWrapper'
              example:
                data:
                  message: verification email sent

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unable to resend verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Email is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/google:
    get:
      tags:
        - Authentication
      summary: Start Google authentication
      description: Redirects the user to Google's OAuth authorization page.
      operationId: googleLogin
      security: []
      responses:
        '307':
          description: Redirect to Google OAuth

        '500':
          description: Failed to start Google authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /auth/google/callback:
    get:
      tags:
        - Authentication
      summary: Google authentication callback
      operationId: googleCallback
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string

        - name: code
          in: query
          required: true
          schema:
            type: string

        - name: oauth_state
          in: cookie
          required: true
          schema:
            type: string

        - name: error
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Google authentication completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseWrapper'

        '400':
          description: Google authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: OAuth state is invalid or Google authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # USERS
  # ============================================================

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []

      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # GMAIL CONNECTION
  # ============================================================

  /connections/google:
    get:
      tags:
        - Gmail
      summary: Connect Gmail account
      description: |
        Starts the Google OAuth flow for connecting the authenticated
        user's Gmail account to STAQ.
      operationId: connectGoogle
      security:
        - bearerAuth: []

      responses:
        '307':
          description: Redirect to Google OAuth

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Failed to start Gmail authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /connections/google/callback:
    get:
      tags:
        - Gmail
      summary: Complete Gmail connection
      operationId: googleConnectionCallback
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string

        - name: code
          in: query
          required: true
          schema:
            type: string

        - name: error
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Gmail account connected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailConnectionResponseWrapper'

        '400':
          description: Gmail authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # TASKS
  # ============================================================

  /tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              queue_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
              name: Daily report
              description: Generate and send daily report
              timeout_seconds: 30
              max_retries: 2

      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseWrapper'

        '400':
          description: Invalid task request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    get:
      tags:
        - Tasks
      summary: List tasks
      operationId: listTasks
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponseWrapper'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Tasks
      summary: Get task
      operationId: getTask
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseWrapper'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    put:
      tags:
        - Tasks
      summary: Update task
      operationId: updateTask
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'

      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseWrapper'

        '400':
          description: Invalid task request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    delete:
      tags:
        - Tasks
      summary: Archive task
      operationId: deleteTask
      security:
        - bearerAuth: []

      responses:
        '204':
          description: Task archived successfully

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # QUEUES
  # ============================================================

  /queues:
