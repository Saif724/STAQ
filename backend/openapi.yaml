        '404':
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    delete:
      tags:
        - Queues
      summary: Delete queue
      operationId: deleteQueue
      security:
        - bearerAuth: []

      responses:
        '204':
          description: Queue deleted successfully

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Queue cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # TRIGGERS
  # ============================================================

  /triggers:
    post:
      tags:
        - Triggers
      summary: Create trigger
      operationId: createTrigger
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTriggerRequest'
            examples:
              once:
                summary: One-time trigger
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  trigger_type: ONCE
                  timezone: Asia/Dhaka
                  start_at: "2026-10-01T10:00:00+06:00"

              daily:
                summary: Daily trigger
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  trigger_type: DAILY
                  timezone: Asia/Dhaka
                  start_at: "2026-10-01T10:00:00+06:00"

              cron:
                summary: Cron trigger
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  trigger_type: CRON
                  cron_expression: "0 10 * * *"
                  timezone: Asia/Dhaka
                  start_at: "2026-10-01T10:00:00+06:00"

      responses:
        '200':
          description: Trigger created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponseWrapper'

        '400':
          description: Invalid trigger configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /tasks/{taskID}/triggers:
    parameters:
      - name: taskID
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Triggers
      summary: List triggers for a task
      operationId: listTaskTriggers
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Triggers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerListResponseWrapper'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /triggers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Triggers
      summary: Get trigger
      operationId: getTrigger
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Trigger retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponseWrapper'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Trigger not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    put:
      tags:
        - Triggers
      summary: Update trigger
      operationId: updateTrigger
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTriggerRequest'

      responses:
        '200':
          description: Trigger updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponseWrapper'

        '400':
          description: Invalid trigger configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
