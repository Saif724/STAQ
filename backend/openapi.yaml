                $ref: '#/components/schemas/ErrorResponse'


    put:
      tags:
        - Queues
      summary: Update queue
      operationId: updateQueue
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQueueRequest'

      responses:
        '200':
          description: Queue updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponseWrapper'

        '400':
          description: Invalid queue request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required
          content:
            application/json:
              schema:
