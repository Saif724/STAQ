# ==============================================================
# COMPONENTS
# ==============================================================

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:

    # ----------------------------------------------------------
    # COMMON
    # ----------------------------------------------------------

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: Invalid request


    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: logged out successfully


    MessageResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MessageResponse'


    HealthResponse:
      type: object
      required:
        - status
        - database
        - redis
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        database:
          type: string
          enum:
            - ok
            - error
        redis:
          type: string
          enum:
            - ok
            - error


    # ----------------------------------------------------------
    # AUTHENTICATION
    # ----------------------------------------------------------

    RegisterRequest:
      type: object
      required:
        - full_name
        - email
        - password
      properties:
        full_name:
          type: string
          example: Saif Ahmed
        email:
          type: string
          format: email
          example: saif@example.com
        password:
          type: string
          format: password
          example: StrongPassword123!


    RegisterResponse:
      type: object
      required:
        - id
        - full_name
        - email
        - email_verified
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean


    RegisterResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/RegisterResponse'


    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password


    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string


    LoginResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'


    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string


    RefreshResponse:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string


    RefreshResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/RefreshResponse'


    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string


    VerifyEmailRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
          example: "483921"


    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email


    # ----------------------------------------------------------
    # USER
    # ----------------------------------------------------------

    User:
      type: object
      required:
        - id
        - full_name
        - email
        - email_verified
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean


    UserResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'


    # ----------------------------------------------------------
    # GMAIL CONNECTION
    # ----------------------------------------------------------

    GmailConnection:
      type: object
      required:
        - id
        - user_id
        - provider
        - provider_account_id
        - account_email
        - scopes
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        provider:
          type: string
          example: GOOGLE
        provider_account_id:
          type: string
        account_email:
          type: string
          format: email
        scopes:
          type: array
          items:
            type: string
          example:
            - openid
            - profile
            - email
            - https://www.googleapis.com/auth/gmail.send
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    GmailConnectionResponse:
      type: object
      required:
        - user_id
        - connection
        - provider
        - account_email
      properties:
        user_id:
          type: string
          format: uuid
        connection:
          $ref: '#/components/schemas/GmailConnection'
        provider:
          type: string
          example: GOOGLE
        account_email:
          type: string
          format: email


    GmailConnectionResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/GmailConnectionResponse'


    # ----------------------------------------------------------
    # TASKS
    # ----------------------------------------------------------

    CreateTaskRequest:
      type: object
      description: queue_id is required; the API does not select a default queue.
      required:
        - queue_id
        - name
        - timeout_seconds
        - max_retries
      properties:
        queue_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        timeout_seconds:
          type: integer
          minimum: 1
        max_retries:
          type: integer
          minimum: 0


    UpdateTaskRequest:
      type: object
      required:
        - queue_id
        - name
        - status
        - timeout_seconds
        - max_retries
      properties:
        queue_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - Active
            - Paused
            - Archived
        timeout_seconds:
          type: integer
          minimum: 1
        max_retries:
          type: integer
          minimum: 0


    Task:
      type: object
      required:
        - id
        - user_id
        - queue_id
        - name
        - status
        - timeout_seconds
        - max_retries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        queue_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - Active
            - Paused
            - Archived
        timeout_seconds:
          type: integer
        max_retries:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    TaskResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Task'


    TaskListResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'


    # ----------------------------------------------------------
    # QUEUES
    # ----------------------------------------------------------

    CreateQueueRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true


    UpdateQueueRequest:
      type: object
      required:
        - name
        - is_active
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean


    Queue:
      type: object
      required:
        - id
        - name
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time


    QueueResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Queue'


    QueueListResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Queue'


    # ----------------------------------------------------------
    # TRIGGERS
    # ----------------------------------------------------------

    CreateTriggerRequest:
      type: object
      required:
        - task_id
        - trigger_type
        - timezone
        - start_at
      properties:
        task_id:
          type: string
          format: uuid
        trigger_type:
          type: string
          enum:
            - ONCE
            - DAILY
            - WEEKLY
            - MONTHLY
            - YEARLY
            - CRON
        cron_expression:
          type: string
          nullable: true
        timezone:
          type: string
          example: Asia/Dhaka
        start_at:
          type: string
          format: date-time


    UpdateTriggerRequest:
      type: object
      required:
        - trigger_type
        - timezone
        - start_at
        - is_active
      properties:
        trigger_type:
          type: string
          enum:
            - ONCE
            - DAILY
            - WEEKLY
            - MONTHLY
            - YEARLY
            - CRON
        cron_expression:
          type: string
          nullable: true
        timezone:
          type: string
        start_at:
          type: string
          format: date-time
        is_active:
          type: boolean


    Trigger:
      type: object
      required:
        - id
        - task_id
        - trigger_type
        - timezone
        - start_at
        - next_run_at
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        trigger_type:
          type: string
          enum:
            - ONCE
            - DAILY
            - WEEKLY
            - MONTHLY
            - YEARLY
            - CRON
        cron_expression:
          type: string
          nullable: true
        timezone:
          type: string
        start_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    TriggerResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Trigger'


    TriggerListResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'


    # ----------------------------------------------------------
    # ACTIONS
    # ----------------------------------------------------------

    CreateActionRequest:
      type: object
      required:
        - task_id
        - action_type
        - execution_order
        - configuration
        - continue_on_failure
      properties:
        task_id:
          type: string
          format: uuid
        action_type:
          type: string
          enum:
            - REMINDER
            - EMAIL
            - HTTP
            - SHELL
        execution_order:
          type: integer
          minimum: 1
        configuration:
          type: object
          additionalProperties: true
        continue_on_failure:
          type: boolean


    UpdateActionRequest:
      type: object
      required:
        - action_type
        - execution_order
        - configuration
        - continue_on_failure
      properties:
        action_type:
          type: string
          enum:
            - REMINDER
            - EMAIL
            - HTTP
            - SHELL
        execution_order:
          type: integer
          minimum: 1
        configuration:
          type: object
          additionalProperties: true
        continue_on_failure:
          type: boolean


    Action:
      type: object
      required:
        - id
        - task_id
        - action_type
        - execution_order
        - configuration
        - continue_on_failure
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        action_type:
          type: string
          enum:
            - REMINDER
            - EMAIL
            - HTTP
            - SHELL
        execution_order:
          type: integer
        configuration:
          type: string
          format: byte
          description: Base64-encoded JSON bytes in the current Go response model.
        continue_on_failure:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    ActionResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Action'


    ActionListResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Action'


    # ----------------------------------------------------------
    # EXECUTIONS
    # ----------------------------------------------------------

    Execution:
      type: object
      required:
        - id
        - task_id
        - trigger_id
        - scheduled_at
        - status
        - started_at
        - retry_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        trigger_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - SUCCESS
            - FAILED
            - CANCELLED
            - TIMED_OUT
        started_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          format: int64
          nullable: true
        retry_count:
          type: integer
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time


    ExecutionResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Execution'


    ExecutionLog:
      type: object
      required:
        - id
        - execution_id
        - log_level
        - message
        - created_at
      properties:
        id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        log_level:
          type: string
          enum:
            - INFO
            - WARNING
            - ERROR
        message:
          type: string
        created_at:
          type: string
          format: date-time


    ExecutionLogListResponseWrapper:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionLog'