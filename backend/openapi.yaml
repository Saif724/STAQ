      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActionRequest'

            examples:
              reminder:
                summary: Reminder action
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  action_type: REMINDER
                  execution_order: 1
                  configuration:
                    message: Daily report is due
                  continue_on_failure: false

              staq_email:
                summary: STAQ Gmail sender
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  action_type: EMAIL
                  execution_order: 1
                  configuration:
                    sender: STAQ
                    to: recipient@example.com
                    subject: Daily report
                    body: Your daily report is ready.
                  continue_on_failure: false

              user_gmail:
                summary: Connected user Gmail sender
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  action_type: EMAIL
                  execution_order: 1
                  configuration:
                    sender: USER_GMAIL
                    connection_id: 4bb2c3e1-6f40-4b0e-9d7e-7a1c8d1f2b31
                    to: recipient@example.com
                    subject: Daily report
                    body: Your daily report is ready.
                  continue_on_failure: false

              http:
                summary: HTTP action
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  action_type: HTTP
                  execution_order: 1
                  configuration:
                    method: POST
                    url: https://example.com/webhook
                    headers:
                      Content-Type: application/json
                    body: '{"event":"task.completed"}'
                  continue_on_failure: false

              shell:
                summary: Shell action
                value:
                  task_id: 7f7d7a31-5d5c-4f10-8f2c-7c3a3d8f5b12
                  action_type: SHELL
                  execution_order: 1
                  configuration:
                    command: echo
                    args:
